apply from: '../../constants.gradle'
apply plugin: 'com.android.library'

android {
    compileSdkVersion project.ext.compileSdkVersion

    compileOptions {
        // TVIRL
        // sourceCompatibility JavaVersion.VERSION_1_8
        // targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // TVIRL
    namespace 'com.google.android.exoplayer2.ext.rtmp'
    // !TVIRL

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
    }

    testOptions.unitTests.includeAndroidResources = true
}

dependencies {
    implementation project(modulePrefix + 'library-core')
    // TVirl
    // implementation 'net.butterflytv.utils:rtmp-client:3.1.0'
    // Use fork with 16kb page size support
    // com.github.mcxinyu:LibRtmp-Client-for-Android:v3.2.0.m2 is not really 16kb compatible
    // https://github.com/anenasa/LibRtmp-Client-for-Android
    implementation 'com.github.anenasa:LibRtmp-Client-for-Android:16647b19d5'
    // !TVirl
    implementation 'androidx.annotation:annotation:' + androidxAnnotationVersion
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:' + kotlinAnnotationsVersion
    testImplementation project(modulePrefix + 'testutils')
    testImplementation 'org.robolectric:robolectric:' + robolectricVersion
}

ext {
    javadocTitle = 'RTMP extension'
}
apply from: '../../javadoc_library.gradle'

ext {
    releaseArtifact = 'extension-rtmp'
    releaseDescription = 'RTMP extension for ExoPlayer.'
}
apply from: '../../publish.gradle'
